; Configuración específica del reto Forja de Héroes

; Muestra errores durante el desarrollo para detectar problemas en PHP.
display_errors = On

; Informa de todos los niveles de error para facilitar la depuración.
error_reporting = E_ALL

; Establece la zona horaria usada por date() en la ficha.
date.timezone = Europe/Madrid

; Permite comprobar el comportamiento de las etiquetas PHP cortas.
short_open_tag = On

; Oculta la versión de PHP en las cabeceras HTTP por seguridad.
expose_php = Off

; Guarda los errores en el registro del contenedor sin mostrarlos como HTML adicional.
log_errors = On
