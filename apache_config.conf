Listen 8000

<VirtualHost *:8000>
    DocumentRoot "C:/path/to/your/folder"
    
    <Directory "C:/path/to/your/folder">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    
    ErrorLog "logs/retro_error.log"
    CustomLog "logs/retro_access.log" combined
</VirtualHost>
