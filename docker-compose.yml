version: '3.8'

services:
  php1:
    image: php:8.4-apache
    ports:
      - "8000:80"
    container_name: php_web_1
    restart: unless-stopped
    volumes:
      - ./inicio:/var/www/html
    networks:
      - docker_app_network

  php2:
    image: php:8.4-apache
    ports:
      - "8001:80"
    container_name: php_web_2
    restart: unless-stopped
    volumes:
      - ./html:/var/www/html
    networks:
      - docker_app_network

  php3:
    image: php:8.4-apache
    ports:
      - "8002:80"
    container_name: php_web_3
    restart: unless-stopped
    volumes:
      - ./forja:/var/www/html
    networks:
      - docker_app_network

  php4:
    image: php:8.4-apache
    ports:
      - "8003:80"
    container_name: php_web_4
    restart: unless-stopped
    volumes:
      - ./forja-heroes-ii/src:/var/www/html
    networks:
      - docker_app_network

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test
    restart: unless-stopped
    networks:
      - docker_app_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "8080:80"
    container_name: phpmyadmin_admin
    environment:
      PMA_HOST: mysql_db
      PMA_USER: root
      PMA_PASSWORD: root
    restart: unless-stopped
    depends_on:
      - mysql
    networks:
      - docker_app_network

networks:
  docker_app_network:
    driver: bridge
