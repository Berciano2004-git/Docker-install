<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BERCIANO TECH - Terminal 1985</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            background: #000000;
            font-family: 'Press Start 2P', cursive;
            color: #00ff00;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Líneas de escaneo CRT */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.3),
                rgba(0, 0, 0, 0.3) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 998;
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0% { opacity: 0.97; }
            50% { opacity: 1; }
            100% { opacity: 0.97; }
        }

        /* Efecto de terminal antigua */
        .terminal {
            background: #000000;
            border: 3px solid #00ff00;
            padding: 40px;
            box-shadow: 
                0 0 30px rgba(0, 255, 0, 0.5),
                inset 0 0 20px rgba(0, 0, 0, 0.8);
            text-align: center;
            z-index: 1;
            position: relative;
            max-width: 600px;
            animation: terminalGlow 2s ease-in-out infinite;
        }

        @keyframes terminalGlow {
            0%, 100% { box-shadow: 0 0 30px rgba(0, 255, 0, 0.5), inset 0 0 20px rgba(0, 0, 0, 0.8); }
            50% { box-shadow: 0 0 50px rgba(0, 255, 0, 0.7), inset 0 0 20px rgba(0, 0, 0, 0.8); }
        }

        /* Título principal */
        h1 {
            color: #00ff00;
            font-size: 1.8rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #00ff00;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 49%, 100% { opacity: 1; }
            50%, 99% { opacity: 0.7; }
        }

        /* Subtítulo */
        .subtitle {
            color: #00ff00;
            font-size: 0.7rem;
            margin-bottom: 30px;
            text-shadow: 0 0 5px #00ff00;
            letter-spacing: 2px;
        }

        /* Línea divisora retro */
        .divider {
            border: 1px solid #00ff00;
            margin: 20px 0;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
        }

        /* Contenedor de botones */
        .button-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 40px;
            flex-wrap: wrap;
        }

        /* Botones retro */
        .btn-retro {
            background: #000000;
            color: #00ff00;
            border: 2px solid #00ff00;
            padding: 15px 30px;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.8rem;
            cursor: pointer;
            box-shadow: 
                0 0 10px rgba(0, 255, 0, 0.4),
                inset 0 0 5px rgba(0, 255, 0, 0.2);
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
        }

        .btn-retro::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(0, 255, 0, 0.1);
            transition: left 0.3s;
            z-index: -1;
        }

        .btn-retro:hover {
            box-shadow: 
                0 0 20px rgba(0, 255, 0, 0.8),
                inset 0 0 10px rgba(0, 255, 0, 0.3),
                0 0 30px rgba(0, 255, 0, 0.5);
            transform: scale(1.05);
            background: rgba(0, 255, 0, 0.1);
        }

        .btn-retro:active {
            transform: scale(0.98);
            box-shadow: 
                0 0 10px rgba(0, 255, 0, 0.8),
                inset 0 0 15px rgba(0, 255, 0, 0.4);
        }

        /* Efecto de parpadeo en hover */
        .btn-retro:hover::before {
            left: 100%;
        }

        /* Mensaje de bienvenida */
        .welcome-text {
            color: #00ff00;
            font-size: 0.7rem;
            line-height: 1.8;
            margin-bottom: 20px;
            text-align: center;
            text-shadow: 0 0 5px #00ff00;
        }

        .welcome-text p {
            margin: 5px 0;
        }

        /* Indicador de cursor */
        .cursor {
            display: inline-block;
            width: 10px;
            height: 15px;
            background: #00ff00;
            margin-left: 5px;
            animation: cursor-blink 1s infinite;
            box-shadow: 0 0 10px #00ff00;
        }

        @keyframes cursor-blink {
            0%, 49%, 100% { opacity: 1; }
            50%, 99% { opacity: 0; }
        }

        @media (max-width: 768px) {
            .terminal {
                padding: 20px;
            }

            h1 {
                font-size: 1.2rem;
            }

            .btn-retro {
                font-size: 0.6rem;
                padding: 10px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="terminal">
        <h1>» BERCIANO TECH «</h1>
        <p class="subtitle">▓▒░ SISTEMA DE BIENVENIDA ░▒▓</p>
        
        <div class="divider"></div>

        <div class="welcome-text">
            <p>&gt; CONECTANDO AL SERVIDOR...</p>
            <p>&gt; AUTENTICACIÓN: OK</p>
            <p>&gt; ESTADO: <span style="color: #00ff00; text-shadow: 0 0 5px #00ff00;">● EN LÍNEA</span></p>
            <p>&gt; BIENVENIDO AL FUTURO<span class="cursor"></span></p>
        </div>

        <div class="divider"></div>

        <div class="button-container">
            <button class="btn-retro" onclick="clickSound(); showGreeting()">
                👋 SALUDO
            </button>
            <button class="btn-retro" onclick="clickSound(); openPhpMyAdmin()">
                📊 PHPMYADMIN
            </button>
            <button class="btn-retro" onclick="clickSound(); openAres()">
                🎓 ARES GUIADO
            </button>
            <button class="btn-retro" onclick="clickSound(); openForja()">
                ⚒ FORJA DE HÉROES
            </button>
            <button class="btn-retro" onclick="clickSound(); openForjaII()">
                🏰 FORJA DE HÉROES II
            </button>
        </div>
    </div>

    <script>
        // Efectos de sonido retro
        function clickSound() {
            try {
                const frequencies = [523.25, 659.25, 783.99];
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                frequencies.forEach((freq, i) => {
                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();
                    osc.connect(gain);
                    gain.connect(audioContext.destination);
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.1, audioContext.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                    osc.start(audioContext.currentTime + i * 0.05);
                    osc.stop(audioContext.currentTime + 0.1 + i * 0.05);
                });
            } catch (e) {
                console.log('Audio no disponible');
            }
        }

        function showGreeting() {
            alert('╔══════════════════════════════╗\n║  BIENVENIDO A BERCIANO TECH  ║\n║  ▓ AÑO 2026-27 - RETRO MODE ▓  ║\n║  Disfrutando la nostalgia... ║\n╚══════════════════════════════╝\n\n[ACEPTAR]');
        }

        function openPhpMyAdmin() {
            // Abrir phpMyAdmin directamente en una nueva ventana
            window.open('http://localhost:8080/', 'phpMyAdmin', 'width=1200,height=800');
        }

        function openAres() {
            window.open('http://localhost:8001/', 'AresGuiado', 'width=1200,height=800');
        }

        function openForjaII() {
            window.open('http://localhost:8003/expedicion.php', 'ForjaHeroesII', 'width=1200,height=900');
        }

        function openForja() {
            window.open('http://localhost:8002/', 'ForjaHeroes', 'width=1200,height=800');
        }


    </script>
</body>
</html>
